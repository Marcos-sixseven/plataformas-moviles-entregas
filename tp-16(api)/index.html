<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorApi</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; color: #333; }
        input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .card { border: 1px solid #ccc; padding: 10px; background: #f9f9f9; display: flex; flex-direction: column; justify-content: space-between; }
        button { padding: 8px 12px; background: #0066cc; color: #fff; border: none; cursor: pointer; margin-top: 8px; }
        button:hover { background: #004999; }
        .loading { font-style: italic; color: #666; margin: 20px 0; }
        
        /* Modal simple */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; padding: 20px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; border-radius: 4px; }
        .model-item { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <h2><center>Motor consulta API</center></h2>
    <input type="text" id="searchInput" placeholder="Buscar marca..." oninput="filtrarMarcas()">

    <div id="loading" class="loading">Cargando datos...</div>
    <div id="results" class="grid"></div>

    <div id="modalOverlay" class="modal-overlay" onclick="cerrarModalFuera(event)">
        <div class="modal">
            <h3 id="modalTitle">Modelos</h3>
            <div id="modalLoading" class="loading" style="display:none;">Cargando modelos...</div>
            <ul id="modelList" style="list-style:none; padding:0;"></ul>
            <button onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <script>
        let todasLasMarcas = [];

        async function obtenerDatosAPI() {
            const url = 'https://vpic.nhtsa.dot.gov/api/vehicles/getallmakes?format=json';
            try {
                const response = await fetch(url);
                const data = await response.json();
                todasLasMarcas = data.Results;
                
                document.getElementById('loading').style.display = 'none';
                mostrarEnPantalla(todasLasMarcas.slice(0, 20));
            } catch (error) {
                document.getElementById('loading').innerHTML = '<span style="color:red">Error de conexión con la API.</span>';
                console.error(error);
            }
        }

        function mostrarEnPantalla(marcas) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (marcas.length === 0) {
                resultsDiv.innerHTML = '<p>No se encontraron marcas.</p>';
                return;
            }

            marcas.forEach(marca => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <strong>${marca.Make_Name}</strong><br>
                        <small>ID: ${marca.Make_ID}</small>
                    </div>
                    <button onclick="verModelos(${marca.Make_ID}, '${marca.Make_Name.replace(/'/g, "\\'")}')">Ver Modelos</button>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function filtrarMarcas() {
            const texto = document.getElementById('searchInput').value.toLowerCase();
            const filtradas = todasLasMarcas.filter(m => m.Make_Name.toLowerCase().includes(texto));
            mostrarEnPantalla(filtradas.slice(0, 20));
        }

        async function verModelos(makeId, makeName) {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalLoading = document.getElementById('modalLoading');
            const modelList = document.getElementById('modelList');

            modalTitle.innerText = `Modelos de: ${makeName}`;
            modelList.innerHTML = '';
            modalLoading.style.display = 'block';
            modalOverlay.classList.add('active');

            const urlModelos = `https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeId/${makeId}?format=json`;

            try {
                const response = await fetch(urlModelos);
                const data = await response.json();
                modalLoading.style.display = 'none';

                if (data.Results.length === 0) {
                    modelList.innerHTML = '<p>No hay modelos registrados.</p>';
                    return;
                }

                data.Results.forEach(modelo => {
                    const li = document.createElement('li');
                    li.className = 'model-item';
                    li.innerHTML = `
                        <span>${modelo.Model_Name}</span>
                        <small>ID: ${modelo.Model_ID}</small>
                    `;
                    modelList.appendChild(li);
                });

            } catch (error) {
                modalLoading.style.display = 'none';
                modelList.innerHTML = '<p style="color:red;">Error al cargar los modelos.</p>';
                console.error(error);
            }
        }

        function cerrarModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function cerrarModalFuera(event) {
            if (event.target.id === 'modalOverlay') {
                cerrarModal();
            }
        }

        obtenerDatosAPI();
    </script>
</body>
</html>
